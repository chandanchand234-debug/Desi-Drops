<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https:; img-src data:; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
<title>Desi Drops – Orders (private)</title>
<style>
:root{--bg:#09050f;--surface:#150b24;--ink:#fff7ed;--muted:#c3add9;--line:#3b1f63;--accent:#ff6a1a;--ok:#22c55e;--bad:#e11d48}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
main{width:100%;max-width:420px;margin:auto}
main.wide{max-width:860px}
h1{font-size:26px;margin:8px 0 4px;text-align:center}
.sub{color:var(--muted);margin:0 0 24px;font-size:14px;text-align:center}
input,button{font:inherit}
input{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
button{cursor:pointer;border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--accent);color:#14051f;width:100%}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);width:auto}
button.ok{background:var(--ok);color:#04210f;width:auto}
button.bad{background:var(--bad);color:#fff;width:auto}
button:disabled{opacity:.5;cursor:default}
.box{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px 28px;box-shadow:0 20px 40px rgba(0,0,0,0.5);text-align:center}
.logo-container{display:flex;justify-content:center;margin-bottom:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs button{padding:8px 14px;width:auto}
.tabs button[aria-pressed=true]{background:var(--accent);color:#14051f}
.tabs button[aria-pressed=false]{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.id{font-weight:800;font-size:18px}
.badge{display:inline-block;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700;background:#ffffff1a}
.badge.pending{background:#ffb02033;color:#ffb020}.badge.accepted{background:#22c55e33;color:#4ade80}.badge.declined{background:#e11d4833;color:#ff6b8b}.badge.completed{background:#22d3ee33;color:#22d3ee}
dl{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;margin:12px 0;text-align:left}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.err{color:#ff6b8b;min-height:22px;margin-top:10px;font-size:14px}
.hide{display:none}
a{color:var(--accent)}
.pw-wrap{position:relative;display:block;margin-top:6px}
.pw-wrap input{padding-right:50px}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);padding:6px 10px;display:flex;align-items:center;justify-content:center;cursor:pointer;width:auto}
.pw-toggle:hover{color:var(--ink)}
label{display:block;text-align:left;font-size:14px;font-weight:600;color:var(--muted)}
@media(max-width:520px){dl{grid-template-columns:1fr}dt{margin-top:6px}}
</style>
</head>
<body>
<main id="mainWrap">
  <section id="login" class="box">
    <div class="logo-container">
      <svg width="64" height="64" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a1a"/><stop offset="1" stop-color="#ff2d95"/></linearGradient></defs><path d="M20 2C20 2 6 16.5 6 25a14 14 0 0 0 28 0C34 16.5 20 2 20 2Z" fill="url(#lg)"/><path d="M13 27.5c1.2 3.6 4 5.6 7 5.6" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/><text x="20" y="29.5" text-anchor="middle" font-family="'Saira Semi Condensed',sans-serif" font-weight="800" font-size="17" fill="#fff">D</text></svg>
    </div>
    <h1>Desi Drops Admin</h1>
    <p class="sub">Sign in to manage orders and customer details</p>

    <div style="text-align:left">
      <label for="pw">Admin Password</label>
      <div class="pw-wrap">
        <input id="pw" type="password" autocomplete="current-password" maxlength="200">
        <button type="button" id="togglePw" class="pw-toggle" aria-label="Toggle password visibility"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <div class="err" id="lerr" role="alert"></div>
    <div style="margin-top:16px"><button id="go" type="button">Sign In</button></div>
  </section>

  <section id="app" class="hide">
    <div class="row">
      <h1 style="text-align:left;margin:0">Orders Dashboard</h1>
      <div class="acts" style="margin:0"><button class="ghost" id="refresh" type="button">Refresh</button><button class="ghost" id="out" type="button">Log out</button></div>
    </div>
    <p class="sub" style="text-align:left;margin-top:4px">Private management portal for Desi Drops.</p>
    <div class="tabs" id="tabs"></div>
    <div id="count" class="sub" style="text-align:left;margin:10px 0"></div>
    <div id="list"></div>
  </section>
</main>

<script>
const API = "https://desi-drops-api.chand09876321.workers.dev";

const $ = (id) => document.getElementById(id);
let token = null, filter = "";
try { token = sessionStorage.getItem("dd_admin"); } catch (e) {}

const eye = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
const eyeOff = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

$("togglePw").onclick = () => {
  const p = $("pw");
  if (p.type === "password") {
    p.type = "text";
    $("togglePw").innerHTML = eyeOff;
  } else {
    p.type = "password";
    $("togglePw").innerHTML = eye;
  }
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

async function call(method, path, body) {
  try {
    const r = await fetch(API.replace(/\/+$/, "") + path, {
      method,
      headers: Object.assign({ "Content-Type": "application/json" }, token ? { Authorization: "Bearer " + token } : {}),
      body: body ? JSON.stringify(body) : undefined,
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && j.error === "auth") logout(true);
    return { ok: r.ok, status: r.status, j };
  } catch (e) {
    return { ok: false, status: 0, j: {} };
  }
}

function logout(expired) {
  token = null;
  try { sessionStorage.removeItem("dd_admin"); } catch (e) {}
  $("app").classList.add("hide");
  $("login").classList.remove("hide");
  $("mainWrap").classList.remove("wide");
  if (expired === true) $("lerr").textContent = "Your session ended. Please log in again.";
}

$("go").onclick = async () => {
  $("lerr").textContent = "";
  $("go").disabled = true;
  const x = await call("POST", "/api/admin/login", { password: $("pw").value });
  $("go").disabled = false;
  if (x.ok && x.j.token) {
    token = x.j.token;
    try { sessionStorage.setItem("dd_admin", token); } catch (e) {}
    $("pw").value = "";
    show();
  } else {
    $("lerr").textContent = x.status === 429 ? "Too many tries. Please wait a few minutes." : x.status === 0 ? "Could not reach the server (check your internet or connection)." : "Wrong password.";
  }
};
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
$("out").onclick = () => logout();
$("refresh").onclick = () => load();

function show() {
  $("login").classList.add("hide");
  $("app").classList.remove("hide");
  $("mainWrap").classList.add("wide");
  drawTabs();
  load();
}

function drawTabs() {
  const t = $("tabs");
  t.textContent = "";
  [["", "All"], ["pending", "Waiting"], ["accepted", "Accepted"], ["completed", "Completed"], ["declined", "Declined"]].forEach((k) => {
    const b = el("button", null, k[1]);
    b.type = "button";
    b.setAttribute("aria-pressed", String(filter === k[0]));
    b.onclick = () => { filter = k[0]; drawTabs(); load(); };
    t.append(b);
  });
}

const LABEL = { pending: "Waiting", accepted: "Accepted", declined: "Declined", completed: "Completed" };

async function load() {
  $("count").textContent = "Loading...";
  const x = await call("GET", "/api/admin/orders" + (filter ? "?status=" + filter : ""));
  const list = $("list");
  list.textContent = "";
  if (!x.ok) { $("count").textContent = "Could not load orders."; return; }
  const orders = x.j.orders || [];
  $("count").textContent = orders.length + (orders.length === 1 ? " order" : " orders");
  orders.forEach((o) => list.append(card(o)));
}

function card(o) {
  const c = el("div", "box");
  const top = el("div", "row");
  const left = el("div");
  left.append(el("div", "id", o.id), el("div", "sub", new Date(o.created).toLocaleString()));
  top.append(left, el("span", "badge " + o.status, LABEL[o.status] || o.status));
  c.append(top);
  const dl = el("dl");
  [
    ["Service", o.plan],
    ["Amount", o.amountText + (o.currency !== "INR" ? " (INR " + o.price + ")" : "")],
    ["Customer", o.name || "(erased)"],
    ["Email", o.email],
    ["Contact", o.contact],
    ["Requirements", o.notes || "None given"],
    ["Your note", o.note],
  ].forEach((r) => {
    if (!r[1]) return;
    dl.append(el("dt", null, r[0]), el("dd", null, r[1]));
  });
  c.append(dl);

  const note = el("input");
  note.placeholder = "Private note (optional), for example: paid by UPI";
  note.maxLength = 300;
  note.value = o.note || "";
  c.append(note);

  const acts = el("div", "acts");
  const set = (status, label, cls) => {
    const b = el("button", cls, label);
    b.type = "button";
    if (o.status === status) b.disabled = true;
    b.onclick = async () => {
      b.disabled = true;
      const x = await call("POST", "/api/admin/orders/status", { id: o.id, status, note: note.value });
      if (x.ok) load(); else { b.disabled = false; $("count").textContent = "Could not update that order."; }
    };
    acts.append(b);
  };
  set("accepted", "Accept", "ok");
  set("completed", "Mark completed", "ghost");
  set("declined", "Decline", "bad");
  set("pending", "Back to waiting", "ghost");
  if (o.email) {
    const m = el("a", null, "Reply by email");
    m.href = "mailto:" + o.email + "?subject=" + encodeURIComponent("Your Desi Drops order " + o.id);
    m.style.alignSelf = "center";
    acts.append(m);
  }
  c.append(acts);
  return c;
}

if (token) show();
</script>
</body>
</html>
